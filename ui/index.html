          ${segs.length ? '' : '<p class="muted">※ 先に「メンバー区分」を作成してください（通知の対象になります）。</p>'}
          ${notifs.length ? rows : '<div class="empty">まだ通知がありません。<br>「＋ 新規通知」から最初の通知を作成しましょう。</div>'}`;

        // 通知フォーム（子ページ）は main 直下の #nFormHost に注入する（メンバー配置の
        // <dialog> は静的 HTML に常駐）。
        $('#nFormHost').innerHTML = segs.length ? notifForm() : '';
        if (segs.length) {
          bindNotifForm();
          $('#nNewBtn').onclick = () => navigate('notifications/new');
        }
        document.querySelectorAll('[data-nedit]').forEach((b) => {
          b.onclick = () => navigate('notifications/' + b.dataset.nedit + '/edit');
        });
        document.querySelectorAll('[data-nconstraints]').forEach((b) => {
          b.onclick = () => navigate('notifications/' + b.dataset.nconstraints + '/grouping-settings');
        });
        document.querySelectorAll('[data-nrecruit]').forEach((b) => {
          b.onclick = async () => {
            if (!(await confirmDialog('この通知の募集メッセージをチャンネルへ投稿します。', { okLabel: '送信する' }))) return;
            await withBusy(b, async () => {
              try { const r = await api('/notifications/' + b.dataset.nrecruit + '/recruit', { method: 'POST' });
                toast(r && r.message ? r.message : '募集を送信しました'); }
              catch (e) { toast(e.message, true); }
            });
          };
        });
        document.querySelectorAll('[data-ndel]').forEach((b) => {
          b.onclick = async () => {
            if (!(await confirmDialog('この通知を、配下の開催日・回答ごとすべて削除します。元に戻せません。', { danger: true, okLabel: '削除' }))) return;
            try { await api('/notifications/' + b.dataset.ndel, { method: 'DELETE' }); toast('削除しました'); loadNotifications(); }
            catch (e) { toast(e.message, true); }
          };
        });
      }

      // メンバー配置設定ページ（通知設定の子ページ・Notification 単位のマスター設定）
      // = 配置結果の投稿先チャンネル ＋ ペア制約。どちらも即時保存。
      async function loadGroupingSettingsPage(nuuid) {
        const dlg = $('#constraintsDialog');
        $('#constraintsBox').innerHTML = '<p class="muted">読み込み中…</p>';
        openAsPage(dlg);
        let n = cacheNotifs.find((x) => x.uuid === nuuid);
        if (!n) { try { n = await api('/notifications/' + nuuid); } catch (_) {} }
        if (!n) { toast('通知が見つかりません', true); closeAsPage(dlg); navigate(''); return; }
        $('#constraintsTitle').textContent = `メンバー配置設定: ${n.name}`;
        let constraints = [], candidates = [];
        try {
          if (!cacheChannels.length) cacheChannels = await api('/guilds/' + guild.id + '/channels').catch(() => []);
          constraints = await api('/notifications/' + nuuid + '/constraints');
          // 追加フォームの候補 = 対象区分のメンバー
          const segs = cacheSegments.length ? cacheSegments : await api('/segments?guild_id=' + encodeURIComponent(guild.id));
          const seg = segs.find((s) => s.id === n.segment_id);
          if (seg) candidates = await api('/segments/' + seg.uuid + '/members');
        } catch (e) { toast(e.message, true); }
        const chOpts = cacheChannels.map((c) =>
          `<option value="${esc(c.id)}"${c.id === n.grouping_channel_id ? ' selected' : ''}>#${esc(c.name)}</option>`).join('');
        const opts = candidates.map((m) => {
          const nm = m.display_name || m.user_name || m.user_id;
          return `<option value="${esc(m.user_id)}">${esc(nm)}</option>`;
        }).join('');
        const rows = constraints.map((c) => `
          <div class="grouping-constraint-row" data-cuuid="${esc(c.uuid)}">
            <span>${esc(c.user_a_name || c.user_id_a)} ${c.direction === 'together' ? '🤝' : '🚫'} ${esc(c.user_b_name || c.user_id_b)}</span>
            <span>${c.direction === 'together' ? '同じグループに' : '別のグループに'}</span>
            ${c.strength === 'required'
              ? '<span class="pill" style="font-size:11px;background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 55%,transparent)">必須</span>'
              : '<span class="pill" style="font-size:11px">推奨</span>'}
            <span class="spacer"></span>
            <button class="btn sm ghost" data-del-constraint="${esc(c.uuid)}">削除</button>
          </div>`).join('');
        $('#constraintsBox').innerHTML = `
          <div class="summary">🧩 <span>この通知の<b>全開催日で共有</b>される、メンバー配置まわりのマスター設定です。変更はその場で保存されます。</span></div>

          <h3 style="margin-top:18px">📣 配置結果の投稿先</h3>
          <p class="muted" style="font-size:12.5px;margin:0 0 6px">「結果をチャンネルへ投稿」の投稿先チャンネルです。</p>
          <select id="gChannel" style="max-width:360px">
            <option value=""${n.grouping_channel_id ? '' : ' selected'}>募集と同じチャンネル（${esc(chNameOf(n.channel_id))}）</option>
            ${chOpts}
          </select>

          <h3 style="margin-top:22px">🔗 ペア制約</h3>
          <p class="muted" style="font-size:12.5px;margin:0 0 6px">メンバー配置のランダム振り分けと違反チェックに使われます。</p>
          <div class="grouping-constraints-list">
            ${rows || '<div class="empty">まだ制約はありません。下のフォームから追加できます。</div>'}
          </div>
          <div class="grouping-constraints-form" style="margin-top:10px">
            <select id="cUserA"><option value="">メンバーA</option>${opts}</select>
            <select id="cUserB"><option value="">メンバーB</option>${opts}</select>
            <select id="cDirection">
              <option value="together">🤝 同じグループに</option>
              <option value="apart">🚫 別のグループに</option>
            </select>
            <select id="cStrength">
              <option value="required">必須</option>
              <option value="preferred">推奨</option>
            </select>
            <button class="btn sm" id="cAdd">＋ 追加</button>
          </div>
          ${candidates.length ? '' : '<p class="muted" style="font-size:12px;margin-top:8px">※ 対象区分のメンバーが取得できないため追加はできません（一覧の削除は可能）。</p>'}`;
        $('#gChannel').onchange = async (e) => {
          const v = e.target.value || null;
          try {
            await api('/notifications/' + nuuid + '/grouping-channel',
              { method: 'PUT', body: JSON.stringify({ channel_id: v }) });
            n.grouping_channel_id = v; // キャッシュ側も同期
            toast('投稿先を保存しました');
          } catch (err) { toast(err.message, true); }
        };
        $('#cAdd').onclick = async (e) => {
          const a = $('#cUserA').value, b = $('#cUserB').value;
          if (!a || !b || a === b) return toast('異なる 2 名を選んでください', true);
          await withBusy(e.currentTarget, async () => {
            try {
              await api('/notifications/' + nuuid + '/constraints',
                { method: 'POST', body: JSON.stringify({ user_id_a: a, user_id_b: b, direction: $('#cDirection').value, strength: $('#cStrength').value }) });
              loadGroupingSettingsPage(nuuid);
            } catch (err) { toast(err.message, true); }
          });
        };
        document.querySelectorAll('#constraintsBox [data-del-constraint]').forEach((b) => {
          b.onclick = async () => {
            try {
              await api('/notifications/' + nuuid + '/constraints/' + b.dataset.delConstraint, { method: 'DELETE' });
              loadGroupingSettingsPage(nuuid);
            } catch (e) { toast(e.message, true); }
          };
        });
      }

      function humanRRule(rrule, time, dur) {
        const b = parseRRuleToBuilder(rrule);
        const wd = wdLabel(b.byday), tr = fmtTimeRange(time || '', dur);
        if (b.mode === 'weekly') return `毎週 ${wd}曜日 ${tr}`;
        if (b.mode === 'biweekly') return `隔週 ${wd}曜日 ${tr}`;
        return `${humanMonthly(b.rules)} ${tr}`;
      }

      function notifForm() {
        const segOpts = cacheSegments.map((s) => `<option value="${esc(s.uuid)}">${esc(s.name)}</option>`).join('');
        const chOpts = cacheChannels.length
          ? cacheChannels.map((c) => `<option value="${esc(c.id)}">#${esc(c.name)}</option>`).join('')
          : '<option value="">（チャンネルを取得できませんでした）</option>';

        return `<dialog class="modal-lg as-page" id="nDialog" aria-labelledby="nFormTitle">
          <input type="hidden" id="nId" value="" />
          <input type="hidden" id="nType" value="recurring" />

          <div class="modal-head">
            <div>
              <div class="page-crumb"><a href="#" id="nCrumbBack">通知設定</a> <span>›</span> <span id="nCrumbLeaf">新規</span></div>
              <h3 id="nFormTitle">新規通知</h3>
            </div>
            <button type="button" class="page-back" id="nClose" aria-label="戻る">← 戻る</button>
          </div>

          <div class="modal-body modal-body-split">
            <div class="form-pane">
            <!-- Section 1: メンション (プレビュー反映: 1行目) -->
            <div class="subhead">📣 メンション</div>
            <label>対象区分 <span class="req">✱</span></label><select id="nSegment">${segOpts}</select>
            <label>メンション方法</label>

              <option value="none">なし</option>
            </select>
            <p id="nMentionWarn" class="muted hidden" style="font-size:12px;color:var(--warn);margin-top:6px">⚠️ @everyone 区分でバイネームは全員への個別メンションになり、人数が多いと「ほかN名」で省略されます。</p>

            <!-- Section 2: 投稿メッセージ (プレビュー反映: 2-3行目) -->
            <div class="subhead">📝 投稿メッセージ</div>

      function refreshNextOptions(keep) {
        const dates = nextWeekdayDates($('#nWeekday').value, 4);

        $('#nNext').innerHTML = opts.map((d) => `<option value="${d}">${d}（${wdLabel($('#nWeekday').value)}）</option>`).join('');
        if (keep) $('#nNext').value = keep;

      function syncNotifUI() {
        const mode = $('#nMode').value;
        const monthly = mode === 'monthly';
        $('#nMonthlyBox').classList.toggle('hidden', !monthly);
        $('#nWeekdayBox').classList.toggle('hidden', monthly);
        $('#nNextBox').classList.toggle('hidden', mode !== 'biweekly');
        // 回答不要(通知のみ)は回答依存の機能（リマインド/ノルマ/締切）を隠す（ADR 0010/0014）。
        // メンバー配置（旧グループ分け）は ADR 0017 で標準機能化し、フォームにはトグルが無くなった。
        const announceOnly = !$('#nRequireResponse').checked;
        if (announceOnly) { $('#nQuota').checked = false; }
        $('#nQuotaRow').classList.toggle('hidden', announceOnly);
        $('#nQuotaBox').classList.toggle('hidden', announceOnly || !$('#nQuota').checked);
        $('#nRemindStartBox').classList.toggle('hidden', announceOnly);
        $('#nRemindUndecidedBox').classList.toggle('hidden', announceOnly);
        $('#nDeadlineBox').classList.toggle('hidden', announceOnly);
        $('#nAlertRow').classList.toggle('hidden', announceOnly);
        $('#nRecruitLabel').textContent = announceOnly ? '告知を投稿' : '募集を投稿';
        // バイネーム × @everyone 区分は全員個別メンションになるため警告を出す。
        const seg = cacheSegments.find((s) => String(s.id) === $('#nSegment').value);
        const warn = $('#nMention').value === 'members' && !!seg && seg.mention_role_id === '@everyone';
        $('#nMentionWarn').classList.toggle('hidden', !warn);
        // 配信タイムラインの整合性警告（プレビュー文は廃止し、警告のみ表示）
        $('#nWarn').innerHTML = notifPreview().warns.map((w) => `<div class="tl-warn">⚠️ ${esc(w)}</div>`).join('');
        // 募集メッセージプレビュー（右側 sticky pane）を更新
        updateRecruitPreview();
      }
      // 募集メッセージのプレビュー（client-side 簡易版）。
      // 完全再現ではなく、フォーム入力に即時追従する部分のみ反映。メンションは
      // プレースホルダで、複雑な月次/隔週パリティは近似。投稿時は backend が
      // 正確な値で組み立てる。乖離リスクを最小化するため依存範囲は title/body/
      // schedule/deadline/mention 種別/回答要否に限定する。
      function buildRecruitPreviewText() {
        const $v = (id) => ($('#' + id)?.value || '').trim();
        const title = $v('nTitle');
        const body = $v('nBody');
        const mode = $v('nMode') || 'weekly';
        const startTime = $v('nStartTime');
        const weekday = $v('nWeekday');
        const durationN = parseInt($v('nDuration'), 10);
        const dh = $v('nDeadlineHours');
        const deadlineHours = dh === '' ? NaN : Number(dh);
        const mention = $v('nMention') || 'role';
        const requireResponse = !!$('#nRequireResponse')?.checked;

        // メンション部分はプレースホルダ
        let mentionLine = '';
        if (mention === 'role') mentionLine = '@ロール or @everyone\n';
        else if (mention === 'members') mentionLine = '@対象メンバー全員\n';

        // 日時行: 次回開催日（簡易）
        let dateStr = '(次回開催日)';
        let dateObj = null;
        if (mode === 'weekly' && weekday) {
          const dates = nextWeekdayDates(weekday, 1);
          if (dates.length > 0) { dateStr = `${dates[0]} (${wdLabel(weekday)})`; dateObj = dates[0]; }
        } else if (mode === 'biweekly' && weekday) {
          const dates = nextWeekdayDates(weekday, 1);
          if (dates.length > 0) { dateStr = `${dates[0]} (${wdLabel(weekday)}・隔週パリティは投稿時に確定)`; dateObj = dates[0]; }
        } else if (mode === 'monthly') {
          dateStr = '(月次ルールで計算される開催日)';
        }
        // 時刻範囲
        let timeStr = startTime || '--:--';
        if (startTime && Number.isInteger(durationN) && durationN > 0) {
          const [h, m] = startTime.split(':').map(Number);
          const total = h * 60 + m + durationN;
          const eh = Math.floor(total / 60) % 24, em = total % 60;
          timeStr = `${startTime}〜${String(eh).padStart(2, '0')}:${String(em).padStart(2, '0')}`;
        } else if (startTime) {
          timeStr = `${startTime}〜`;
        }
        const dateLine = `日時: **${dateStr} ${timeStr}**`;

        // 回答締切行
        let deadlineLine = '';
        if (requireResponse && Number.isFinite(deadlineHours) && deadlineHours > 0 && dateObj && startTime) {
          const [yy, mm, dd] = dateObj.split('/').map(Number);
          const [hh, mi] = startTime.split(':').map(Number);
          const evt = new Date(yy, mm - 1, dd, hh, mi);
          evt.setHours(evt.getHours() - deadlineHours);
          const dlStr = `${evt.getFullYear()}/${String(evt.getMonth() + 1).padStart(2, '0')}/${String(evt.getDate()).padStart(2, '0')} ${String(evt.getHours()).padStart(2, '0')}:${String(evt.getMinutes()).padStart(2, '0')}`;
          deadlineLine = `\n回答締切: **${dlStr}**`;
        }

        // 合成
        let msg = mentionLine;
        msg += `**${title || '(見出しを入力)'}**\n\n`;
        if (body) msg += body + '\n\n';
        msg += dateLine + deadlineLine;
        // 回答ボタンの有無（OFF=告知のみ時は何も表示しない）
        if (requireResponse) msg += '\n\n〔参加〕〔不参加〕〔未定〕〔状況確認〕';
        return msg;
      }
      let _previewDebounceTimer = null;
      function updateRecruitPreview() {
        if (_previewDebounceTimer) clearTimeout(_previewDebounceTimer);
        _previewDebounceTimer = setTimeout(() => {
          const el = $('#nPreviewContent');
          if (el) el.textContent = buildRecruitPreviewText();
        }, 150);
      }
      // 配信タイムラインの自然文プレビューと整合性警告を組み立てる。
      // 空欄は NaN として「—」表示し、NaN は比較が常に false なので誤警告も出ない。
      function notifPreview() {
        const respond = $('#nRequireResponse').checked;
        const num = (id) => { const v = $('#' + id).value.trim(); return v === '' ? NaN : Number(v); };
        const show = (n) => (isFinite(n) ? n : '—');
        const recruit = num('nRecruit'), rs = num('nRemindStart'), ru = num('nRemindUndecided');
        const dh = $('#nDeadlineHours').value.trim();
        const sh = String($('#nSendHour').value).padStart(2, '0');
        const sched = scheduleSummary();
        const send = `毎日 ${sh}:00 に配信`;
        const warns = [];
        if (!respond) {
          return { text: `${show(recruit)}日前に告知 → 🎉 開催（${sched}）／${send}`, warns };
        }
        const parts = [`${show(recruit)}日前に募集`, `${show(rs)}日前から毎日 未回答へ催促`, `${show(ru)}日前に未定へ`];
        if (dh !== '') parts.push(`開始${Number(dh)}時間前に締切`);
        parts.push(`🎉 開催（${sched}）`);
        if (isFinite(rs) && isFinite(recruit) && rs > recruit) warns.push('未回答リマインド開始が募集より前です（募集前に催促が飛びます）。');
        if (isFinite(ru) && isFinite(rs) && ru > rs) warns.push('未定リマインドが未回答リマインド開始より前です。');
        if (dh !== '' && isFinite(recruit) && Number(dh) > recruit * 24) warns.push('締切が募集より前になっています。');
        return { text: parts.join(' → ') + `／${send}`, warns };
      }
      // 空欄は既定値、0 は 0 のまま（|| は 0 を既定で潰すため使わない）。
      function numOrDefault(id, dflt) { const v = $('#' + id).value.trim(); return v === '' ? dflt : Number(v); }
      let formDirty = false;
      function markDirty() { formDirty = true; }
      function bindNotifForm() {
        refreshNextOptions();
        renderMonthlyRules([]);
        ['nMode', 'nStartTime', 'nNext', 'nDuration', 'nRequireResponse', 'nMention', 'nSegment', 'nSendHour'].forEach((id) => { $('#' + id).onchange = syncNotifUI; });
        ['nRecruit', 'nRemindStart', 'nRemindUndecided', 'nDeadlineHours'].forEach((id) => { $('#' + id).oninput = syncNotifUI; });
        $('#nWeekday').onchange = () => { refreshNextOptions(); syncNotifUI(); };
        $('#nQuota').onchange = syncNotifUI;

        $('#nSave').onclick = (e) => withBusy(e.currentTarget, saveNotif);
        // 子ページ開閉・破棄ガード（dirty 時のみ確認）。
        const dlg = $('#nDialog');
        $('#nClose').onclick = attemptCloseNotif;
        $('#nCancel').onclick = attemptCloseNotif;
        const crumb = $('#nCrumbBack'); if (crumb) crumb.onclick = (e) => { e.preventDefault(); attemptCloseNotif(); };
        dlg.addEventListener('input', markDirty);
        dlg.addEventListener('change', markDirty);
        // タイトル/本文など syncNotifUI を経由しない項目もプレビューに反映させる
        dlg.addEventListener('input', updateRecruitPreview);
        syncNotifUI();
      }
      // 新規=空で開く／編集=流し込んで開く。値はプログラム設定なので input/change は発火せず dirty は立たない。
      function openNotifModal(n) {
        const dlg = $('#nDialog'); if (!dlg) return;
        if (n && n.type === 'oneoff') { toast('単発通知の編集は現在無効です。', true); return; }

      async function attemptCloseNotif() {

          title: '編集中の内容を破棄しますか？',
          okLabel: '破棄して閉じる',
          cancelLabel: '編集に戻る',
          danger: true,

      }
      function resetNotifForm() {
        $('#nId').value = ''; $('#nFormTitle').textContent = '新規通知';
        { const c = $('#nCrumbLeaf'); if (c) c.textContent = '新規'; }

        $('#nRemindStart').value = '3'; $('#nRemindUndecided').value = '1';

        $('#nQuota').checked = false;

        $('#nSendHour').value = '21'; $('#nDeadlineHours').value = ''; $('#nAlertChannel').value = '';

      function fillNotifForm(n) {
        if (!n || !$('#nId')) return;
        // 単発(oneoff)UI は撤去済み。万一の旧データはこのフォームで編集しない（保存で壊さないため）。
        if (n.type === 'oneoff') { toast('単発通知の編集は現在無効です。', true); return; }
        $('#nId').value = n.uuid; $('#nFormTitle').textContent = '編集';

        $('#nBody').value = n.message_body || '';
        if (![...$('#nChannel').options].some((o) => o.value === n.channel_id) && n.channel_id) {
          $('#nChannel').insertAdjacentHTML('afterbegin', `<option value="${esc(n.channel_id)}">ID: ${esc(n.channel_id)}</option>`);
        }
        $('#nChannel').value = n.channel_id || '';
        // segment_uuid を選択（cacheSegments から id → uuid を解決）
        const seg = cacheSegments.find((s) => s.id === n.segment_id);
        $('#nSegment').value = seg ? seg.uuid : '';
        const b = parseRRuleToBuilder(n.rrule);
        $('#nMode').value = b.mode; $('#nWeekday').value = b.byday;
        renderMonthlyRules(b.mode === 'monthly' ? b.rules : []);
        $('#nStartTime').value = n.start_time || '21:00';
        $('#nDuration').value = n.duration_minutes == null ? '' : n.duration_minutes;
        $('#nRecruit').value = n.recruit_days_before; $('#nRemindStart').value = n.remind_start_days;
        $('#nRemindUndecided').value = n.remind_undecided_days;
        $('#nQuotaInterval').value = n.quota_interval_days == null ? '' : n.quota_interval_days;
        $('#nQuota').checked = !!n.quota_enabled;

        $('#nDeadlineHours').value = n.response_deadline_hours == null ? '' : n.response_deadline_hours;
        if (n.change_alert_channel_id && ![...$('#nAlertChannel').options].some((o) => o.value === n.change_alert_channel_id)) {
          $('#nAlertChannel').insertAdjacentHTML('beforeend', `<option value="${esc(n.change_alert_channel_id)}">ID: ${esc(n.change_alert_channel_id)}</option>`);

        syncNotifUI();

      async function saveNotif() {
        const qi = $('#nQuotaInterval').value.trim();
        const dh = $('#nDeadlineHours').value.trim();
        const body = {
          guild_id: guild.id,
          name: $('#nName').value.trim(),
          channel_id: $('#nChannel').value.trim(),
          segment_uuid: $('#nSegment').value,
          type: 'recurring',
          rrule: buildRRule(),
          anchor_date: $('#nMode').value === 'biweekly' ? ($('#nNext').value || null) : null,
          start_time: $('#nStartTime').value.trim() || '21:00',
          duration_minutes: durValue(),
          message_title: $('#nTitle').value.trim(),
          message_body: $('#nBody').value.trim() || null,
          recruit_days_before: numOrDefault('nRecruit', 7),
          remind_start_days: numOrDefault('nRemindStart', 3),

      // ----- 開催回（通知の文脈） -----
      async function loadOccTally(occUuid) {
        const el = $('#tally-' + cssId(occUuid));
        if (!el) return;
        try {
          const b = await api('/occurrences/' + occUuid + '/status');
          el.textContent = `参加 ${b.参加.length}・不参加 ${b.不参加.length}・未定 ${b.未定.length}・未回答 ${b.未回答.length}`;
        } catch (_) { el.textContent = ''; }
      }
      // CSS セレクタで使える ID 形式に変換（UUID のハイフンは CSS でそのまま使えるが、念のため）
      function cssId(uuid) { return String(uuid || '').replace(/[^A-Za-z0-9-]/g, ''); }
      const JADOW = ['日', '月', '火', '水', '木', '金', '土'];
      function jaDow(dateStr) {
        const [y, m, d] = (dateStr || '').split('/').map(Number);
        return (y && m && d) ? JADOW[new Date(y, m - 1, d).getDay()] : '';
      }
      /** 開催回の表示ラベル '2026/06/18 (木) 21:00〜23:00'（dur 未指定なら開始時刻のみ） */
      function occLabel(o, dur) {
        const w = jaDow(o.occurrence_date);
        return `${o.occurrence_date}${w ? ` (${w})` : ''}${o.start_time ? ' ' + fmtTimeRange(o.start_time, dur) : ''}`;
      }
      // ----- メンバー配置（旧称グループ分け・ADR 0015。グループ数1で番号用途も代替）-----
      // groupingState: 現在開いているメンバー配置の状態を保持する。
      // - occId / notifId: 対象
      // - view: API から取得した GroupingView（grouping/groups/pool/diff）
      // - constraints: その通知のペア制約一覧
      // - sortables: SortableJS インスタンス配列（cleanup 用）
      // - dirty: 保存が必要な変更があるか
      const groupingState = { occUuid: null, notifUuid: null, view: null, constraints: [], sortables: [], dirty: false };

      async function openGroupingDialog(occUuid, notifUuid) {
        groupingState.occUuid = occUuid;
        groupingState.notifUuid = notifUuid;
        groupingState.dirty = false;
        $('#groupingErr').textContent = '';
        const dlg = $('#groupingDialog');
        $('#groupingBox').innerHTML = '<p class="muted">読み込み中…</p>';
        openAsPage(dlg);
        $('#groupingClose').onclick = $('#groupingCancel').onclick = attemptCloseGrouping;
        const gcrumb = $('#groupingCrumbBack');
        if (gcrumb) gcrumb.onclick = (e) => { e.preventDefault(); attemptCloseGrouping(); };
        try {
          await reloadGroupingView();
          $('#groupingSave').onclick = (e) => withBusy(e.currentTarget, saveGroupingMembers);
          // プレビューは盤面の現在状態（未保存含む）を同送して生成する（ADR 0015 追補）
          $('#groupingPreview').onclick = (e) => withBusy(e.currentTarget, () => {
            const { assignments, groupOf } = collectCurrentAssignments();
            const pool_user_ids = [...groupOf.entries()].filter(([, g]) => g === null).map(([u]) => u);
            return showPreview('/occurrences/' + groupingState.occUuid + '/grouping/announce?dry_run=1',
              'メンバー配置 プレビュー', JSON.stringify({ assignments, pool_user_ids }));
          });
          $('#groupingAnnounce').onclick = (e) => withBusy(e.currentTarget, announceGrouping);
        } catch (e) { toast(e.message, true); }
      }
      async function attemptCloseGrouping() {
        if (groupingState.dirty) {
          if (!(await confirmDialog('未保存の変更があります。閉じてもよろしいですか？', { okLabel: '閉じる', danger: true }))) return;
        }
        teardownSortables();
        groupingState.dirty = false;
        closeAsPage($('#groupingDialog'));
        navigate(''); // 通知タブの横断一覧へ戻る
      }
      function teardownSortables() {
        for (const s of groupingState.sortables) { try { s.destroy(); } catch (_) {} }
        groupingState.sortables = [];
      }
      async function reloadGroupingView() {
        const occUuid = groupingState.occUuid;
        const view = await api('/occurrences/' + occUuid + '/grouping');
        groupingState.view = view;
        try {
          groupingState.constraints = await api('/notifications/' + groupingState.notifUuid + '/constraints');
        } catch (_) { groupingState.constraints = []; }
        renderGroupingDialog();
      }
      function renderGroupingDialog() {
        const view = groupingState.view;
        const groupCount = view.grouping ? view.grouping.group_count : 2;
        const toolbar = `
          <div class="grouping-toolbar">
            <label>グループ数</label>
            <input type="number" id="groupingCount" min="1" max="50" value="${groupCount}" style="width:80px" />
            <button class="btn sm secondary" id="groupingApplyCount">グループ数を変更</button>
            <button class="btn sm secondary" id="groupingAuto" title="未割り当てメンバーをランダムに配置します（既存配置は維持）。『同じグループ（必須）』のペアはまとめますが、『別のグループに』制約は考慮しません（違反は下に警告表示）">🎲 ランダムに振り分け</button>
            <button class="btn sm ghost" id="groupingClear">クリア</button>
            <span class="spacer"></span>
            <span id="groupingViolBadge" class="hidden" style="font-size:12px;cursor:pointer" title="クリックで違反の詳細へ移動"></span>
            <span class="muted" style="font-size:12px"><span id="groupingStatus"></span> · 参加 ${countCurrentParticipants(view)}名</span>
          </div>`;
        const poolCol = renderColumn({ id: 'pool', name: '未割り当て', members: view.pool }, true);
        const groupCols = (view.groups || []).map((g) => renderColumn(g, false)).join('');
        const board = `<div class="grouping-board" id="groupingBoard">${poolCol}${groupCols}</div>`;
        const alerts = `<div id="groupingAlerts"></div>`;
        // ペア制約・配置の投稿先は Notification 単位のマスター設定なので、編集はこの画面
        // （Occurrence 単位）から分離し「通知設定 › メンバー配置設定」子ページで行う。
        // ここでは違反チェック表示＋導線のみ。
        const constraintsLink = `<p class="muted" style="font-size:12.5px;margin-top:14px">
          🔗 ペア制約（${groupingState.constraints.length}件）と配置結果の投稿先は通知単位の設定です。編集は
          <a href="#" id="groupingEditConstraints">通知設定 › メンバー配置設定</a> から。制約違反があると盤面上に警告表示されます。</p>`;
        $('#groupingBox').innerHTML = toolbar + board + alerts + constraintsLink;
        // 保存ボタンの二義性解消: 初回（グループ枠なし）は「作成」、以降は「保存」
        $('#groupingSave').textContent = view.grouping ? '保存' : 'グループ枠を作成';
        // 行頭ラベルのクリック編集（イベント委譲。カードは D&D や振り直しで作り直されるため）
        $('#groupingBoard').onclick = (ev) => {
          const no = ev.target.closest('.order-no');
          if (!no || no.isContentEditable) return;
          const card = no.closest('.grouping-card');
          if (!card) return;
          startLabelEdit(no, card);
        };
        wireGroupingDialogControls();
        wireStartNoInputs();
        wireSortables();
        evaluateAndPaintViolations();
        updateGroupingStatus();
      }
      // 状態表示（ADR 0015 追補）: dirty を反映する
      function updateGroupingStatus() {
        const el = $('#groupingStatus');
        if (!el) return;
        const v = groupingState.view;
        const dirty = groupingState.dirty;
        el.textContent = !v || !v.grouping ? 'グループ枠未作成' : dirty ? '未保存の変更あり' : '保存済み';
        el.style.color = dirty ? 'var(--warn)' : '';
      }
      function countCurrentParticipants(view) {
        let n = view.pool.length;
        for (const g of (view.groups || [])) {
          for (const m of g.members) {
            if (!view.diff.no_longer_participating.some((x) => x.user_id === m.user_id && x.group_id === g.id)) n++;
          }
        }
        return n;
      }
      function renderColumn(g, isPool) {
        const cls = isPool ? 'grouping-col pool' : 'grouping-col';
        // DOM data 属性として保持する識別子。pool は文字列、それ以外は group の UUID。
        const groupKey = isPool ? 'pool' : esc(g.uuid);
        // 行頭ラベル: 上書き（m.label）はそのまま、残りに start_no 起点の連番
        // （上書きは連番を消費しない）。区切りの「：」は表示時に一律付与。
        const startNo = isPool ? 1 : (Number(g.start_no) || 1);
        let no = startNo - 1;
        const cards = (g.members || []).map((m) => {
          const raw = m.label ? stripLabelSep(m.label) : null;
          const shown = isPool ? null : (raw ? `${raw}：` : `${++no}：`);
          return renderCard(m, isPool ? null : g.id, shown, raw);
        }).join('');
        const uuidAttr = !isPool && g.uuid ? `data-group-uuid="${esc(g.uuid)}"` : '';
        const startEl = isPool ? '' :
          `<span class="grouping-start muted" title="自動連番の開始番号">開始<input type="number" min="0" max="999" value="${startNo}" data-start-group="${esc(g.uuid)}" /></span>`;
        const head = isPool
          ? `<div class="grouping-col-head"><span class="name">📥 ${esc(g.name)} <span class="muted" style="font-size:11px;font-weight:400">（参加回答者のみ）</span></span><span class="count" id="count-${groupKey}">${(g.members || []).length}</span></div>`
          : `<div class="grouping-col-head"><span class="name" ${uuidAttr} contenteditable="false" title="クリックで名前変更">${esc(g.name)}</span>${startEl}<span class="count" id="count-${groupKey}">${(g.members || []).length}</span></div>`;
        return `<div class="${cls}" data-group-key="${groupKey}">
          ${head}
          <div class="grouping-cards" data-group-key="${groupKey}" data-start-no="${startNo}">${cards}</div>
        </div>`;
      }
      const LABEL_EDIT_TITLE = 'クリックで行頭ラベルを編集（例: Leader。「：」は自動で付きます／空にすると連番に戻る）';
      // 行頭ラベルの末尾区切り（：/:）は保存値に持たせない（表示時に一律付与）
      function stripLabelSep(s) { return String(s).replace(/[：:]+$/, ''); }
      function renderCard(m, currentGroupId, orderNo, label) {
        const view = groupingState.view;
        const isGone = currentGroupId !== null && view.diff.no_longer_participating.some(
          (x) => x.user_id === m.user_id && x.group_id === currentGroupId,
        );
        // ponytail: 未割り当てカラムにいる=未割り当てなのは自明なので「新規参加」バッジは出さない
        const badge = isGone ? '<span class="badge gone">不参加に変更</span>' : '';
        const numEl = orderNo != null ? `<span class="order-no" title="${LABEL_EDIT_TITLE}">${esc(orderNo)}</span>` : '';
        const labelAttr = label ? ` data-label="${esc(label)}"` : '';
        return `<div class="grouping-card${isGone ? ' no-longer' : ''}" data-user-id="${esc(m.user_id)}"${labelAttr}>
          ${numEl}<span>${esc(m.name)}</span>${badge}
        </div>`;
      }
      // 行頭ラベルのインライン編集（開催回×メンバー単位・ADR 0015 追補2）。
      // 配置データの一部なので「保存」で確定する（dirty 化のみ）。
      function startLabelEdit(no, card) {
        const prev = card.dataset.label || '';
        no.textContent = prev; // 自動連番は消してラベルだけを編集対象にする
        no.contentEditable = 'true';
        no.focus();
        const range = document.createRange();
        range.selectNodeContents(no);
        const sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(range);
        // blur 頼みにしない（フォーカスが取れない環境で Enter が無視されるのを防ぐ）
        let done = false;
        const commit = (cancelled) => {
          if (done) return;
          done = true;
          no.contentEditable = 'false';
          no.onkeydown = no.onblur = null;
          const v = cancelled ? prev : stripLabelSep(no.textContent.trim()).slice(0, 20);
          if (v) card.dataset.label = v; else delete card.dataset.label;
          if (v !== prev) { groupingState.dirty = true; updateGroupingStatus(); }
          recalcCounts(); // ラベル表示と他カードの連番を振り直す
        };
        no.onkeydown = (ev) => {
          if (ev.key === 'Enter') { ev.preventDefault(); commit(false); }
          if (ev.key === 'Escape') { ev.preventDefault(); commit(true); }
        };
        no.onblur = () => commit(false);
      }
      // 開始番号入力（構造設定＝即時確定）。盤面の連番表示を振り直して API へ保存する。
      function wireStartNoInputs() {
        document.querySelectorAll('#groupingBoard input[data-start-group]').forEach((inp) => {
          inp.onchange = async () => {
            const v = Math.max(0, Math.floor(Number(inp.value) || 0));
            inp.value = v;
            const guuid = inp.dataset.startGroup;
            const cardsEl = document.querySelector(
              `#groupingBoard .grouping-cards[data-group-key="${CSS.escape(guuid)}"]`);
            if (cardsEl) cardsEl.dataset.startNo = String(v);
            recalcCounts();
            try {
              await api('/occurrences/' + groupingState.occUuid + '/grouping/rename',
                { method: 'PUT', body: JSON.stringify({ group_uuid: guuid, start_no: v }) });
              const g = groupingState.view.groups.find((x) => x.uuid === guuid);
              if (g) g.start_no = v;
            } catch (e) { toast(e.message, true); }
          };
        });
      }
      function wireGroupingDialogControls() {
        $('#groupingApplyCount').onclick = (e) => withBusy(e.currentTarget, async () => {
          const gc = Number($('#groupingCount').value);
          if (!Number.isInteger(gc) || gc < 1 || gc > 50) return toast('グループ数は 1〜50', true);
          try {
            if (groupingState.view.grouping) {
              // 暗黙の自動保存はしない（ADR 0015 追補）。未保存の配置変更は明示確認。
              if (groupingState.dirty) {
                if (!(await confirmDialog('未保存の配置変更があります。保存してからグループ数を変更しますか？', { okLabel: '保存して変更' }))) return;
                await saveGroupingMembers(true);
              }
              // 減らす時は「失うものがある時だけ」確認（メンバーがいる／カスタム名が付いている）
              const cur = groupingState.view.grouping.group_count;
              if (gc < cur) {
                const removed = (groupingState.view.groups || []).filter((g) => g.group_index >= gc);
                const losing = removed.some((g) => g.members.length > 0 || g.name !== `グループ ${g.group_index + 1}`);
                if (losing) {
                  const total = removed.reduce((s, g) => s + g.members.length, 0);
                  const names = removed.map((g) => `『${g.name}』`).join('');
                  const msg = `グループ数を ${cur} → ${gc} に変更します。${names}${total > 0 ? `（計${total}名）` : ''}が削除され、メンバーは未割り当てに戻ります。`;
                  if (!(await confirmDialog(msg, { okLabel: '変更する', danger: true }))) return;
                }
              }
            }
            await api('/occurrences/' + groupingState.occUuid + '/grouping',
              { method: 'PUT', body: JSON.stringify({ group_count: gc }) });
            await reloadGroupingView();
            groupingState.dirty = false;
            updateGroupingStatus();
          } catch (e) { toast(e.message, true); }
        });
        // ランダム振り分け（ADR 0015 追補）: サーバーは配置案を返すだけ（dry-run）。
        // 盤面にのみ反映し、「保存」で確定する。
        $('#groupingAuto').onclick = (e) => withBusy(e.currentTarget, async () => {
          if (!groupingState.view.grouping) {
            const gc = Number($('#groupingCount').value);
            if (!Number.isInteger(gc) || gc < 1) return toast('グループ数を指定してください', true);
            // グループ枠の作成は構造操作＝即時確定
            await api('/occurrences/' + groupingState.occUuid + '/grouping',
              { method: 'PUT', body: JSON.stringify({ group_count: gc }) });
            await reloadGroupingView();
          }
          try {
            const { assignments } = collectCurrentAssignments();
            const r = await api('/occurrences/' + groupingState.occUuid + '/grouping/auto-assign',
              { method: 'POST', body: JSON.stringify({ assignments }) });
            applyProposalsToBoard((r && r.proposals) || []);
            toast('ランダムに振り分けました（保存するまで確定しません）');
          } catch (e) { toast(e.message, true); }
        });
        // クリア（ADR 0015 追補）: 盤面のリセットのみ。保存済みの配置は壊さない。
        $('#groupingClear').onclick = async () => {
          if (!(await confirmDialog('盤面の全メンバーを未割り当てに戻します（「保存」するまで確定しません）。', { okLabel: 'クリア' }))) return;
          const pool = document.querySelector('#groupingBoard .grouping-cards[data-group-key="pool"]');
          if (!pool) return;
          let moved = 0;
          document.querySelectorAll('#groupingBoard .grouping-cards').forEach((el) => {
            if (el.dataset.groupKey === 'pool') return;
            el.querySelectorAll('.grouping-card').forEach((c) => { pool.appendChild(c); moved++; });
          });
          if (!moved) return;
          groupingState.dirty = true;
          recalcCounts();
          evaluateAndPaintViolations();
          updateGroupingStatus();
        };
        // グループ名のインライン編集
        document.querySelectorAll('#groupingBoard .grouping-col-head .name[data-group-uuid]').forEach((el) => {
          el.onclick = () => {
            el.contentEditable = 'true';
            el.focus();
            const range = document.createRange();
            range.selectNodeContents(el);
            const sel = window.getSelection();
            sel.removeAllRanges(); sel.addRange(range);
          };
          el.onblur = async () => {
            el.contentEditable = 'false';
            const newName = el.textContent.trim().slice(0, 50);
            if (!newName) { el.textContent = '（名無し）'; return; }
            const guuid = el.dataset.groupUuid;
            if (!guuid) { toast('内部エラー: group_uuid が取得できませんでした。一度再読み込みしてください', true); return; }
            try {
              await api('/occurrences/' + groupingState.occUuid + '/grouping/rename',
                { method: 'PUT', body: JSON.stringify({ group_uuid: guuid, name: newName }) });
              const g = groupingState.view.groups.find((x) => x.uuid === guuid);
              if (g) g.name = newName;
            } catch (e) { toast(e.message, true); }
          };
          el.onkeydown = (ev) => {
            if (ev.key === 'Enter') { ev.preventDefault(); el.blur(); }
            if (ev.key === 'Escape') { ev.preventDefault(); el.blur(); }
          };
        });
        // ペア制約の編集ページ（通知設定の子ページ）への導線。未保存の配置があれば確認してから移動。
        const editC = $('#groupingEditConstraints');
        if (editC) editC.onclick = async (e) => {
          e.preventDefault();
          if (groupingState.dirty && !(await confirmDialog('未保存の変更があります。移動してもよろしいですか？', { okLabel: '移動する', danger: true }))) return;
          groupingState.dirty = false;
          teardownSortables();
          navigate('notifications/' + groupingState.notifUuid + '/grouping-settings');
        };
      }
      function wireSortables() {
        teardownSortables();
        if (typeof window.Sortable === 'undefined') { console.warn('SortableJS not loaded'); return; }
        const cardsEls = document.querySelectorAll('#groupingBoard .grouping-cards');
        cardsEls.forEach((el) => {
          const onChange = () => {
            groupingState.dirty = true;
            recalcCounts();
            evaluateAndPaintViolations();
            updateGroupingStatus();

            group: 'grouping',

            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            // 行頭ラベルはクリック編集するのでドラッグ開始対象から除外する
            filter: '.order-no',
            preventOnFilter: false,
            onEnd: onChange,
            onAdd: onChange,
            onUpdate: onChange,
            onSort: onChange,
          });
          groupingState.sortables.push(s);
        });
      }
      // ランダム振り分けの配置案（group_uuid → user_ids）を盤面に反映する（未保存）
      function applyProposalsToBoard(proposals) {
        let moved = 0;
        for (const p of proposals) {
          if (!p || !p.group_uuid) continue;
          const target = document.querySelector(
            `#groupingBoard .grouping-cards[data-group-key="${CSS.escape(p.group_uuid)}"]`);
          if (!target) continue;
          for (const uid of p.user_ids || []) {
            const card = document.querySelector(
              `#groupingBoard .grouping-card[data-user-id="${cssEscape(uid)}"]`);
            if (card) { target.appendChild(card); moved++; }
          }
        }
        if (!moved) return;
        groupingState.dirty = true;
        recalcCounts();
        evaluateAndPaintViolations();
        updateGroupingStatus();
      }
      function recalcCounts() {
        document.querySelectorAll('#groupingBoard .grouping-cards').forEach((el) => {
          const key = el.dataset.groupKey;
          const cards = el.querySelectorAll('.grouping-card');
          // DnD で位置が変わったら番号を振り直す（pool は番号無し）。
          // ラベル上書き（data-label）はそのまま表示し、連番を消費しない。
          // 連番は列の開始番号（data-start-no）から。「：」は表示時に一律付与。
          if (key !== 'pool') {
            let n = (parseInt(el.dataset.startNo, 10) || 1) - 1;
            cards.forEach((card) => {
              let no = card.querySelector('.order-no');
              if (!no) {
                no = document.createElement('span');
                no.className = 'order-no';
                no.title = LABEL_EDIT_TITLE;
                card.insertBefore(no, card.firstChild);
              }
              no.textContent = card.dataset.label ? `${card.dataset.label}：` : `${++n}：`;
            });
          } else {
            cards.forEach((card) => {
              const no = card.querySelector('.order-no');
              if (no) no.remove();
            });
          }
          const counter = document.querySelector('#count-' + (key === 'pool' ? 'pool' : CSS.escape(key)));
          if (counter) counter.textContent = String(cards.length);
        });
      }
      function collectCurrentAssignments() {
        // 現状の DOM から、各グループに含まれるユーザーID配列を抽出する（group_uuid キー）
        const assignments = [];
        const groupOf = new Map(); // user_id -> group_uuid (string) or null for pool
        document.querySelectorAll('#groupingBoard .grouping-cards').forEach((el) => {
          const key = el.dataset.groupKey;
          const members = Array.from(el.querySelectorAll('.grouping-card')).map((c) => ({
            user_id: c.dataset.userId,
            label: c.dataset.label || null,
          }));
          if (key !== 'pool') {
            assignments.push({ group_uuid: key, members });
            for (const m of members) groupOf.set(m.user_id, key);
          } else {
            for (const m of members) groupOf.set(m.user_id, null);
          }
        });
        return { assignments, groupOf };
      }
      function evaluateAndPaintViolations() {
        // カードのハイライトをいったんクリア
        document.querySelectorAll('#groupingBoard .grouping-card').forEach((el) => {
          el.classList.remove('violated-required');
          el.classList.remove('violated-preferred');
        });
        const { groupOf } = collectCurrentAssignments();
        const required = [], preferred = [];
        for (const c of groupingState.constraints) {
          const ga = groupOf.get(c.user_id_a);
          const gb = groupOf.get(c.user_id_b);
          if (ga === undefined || gb === undefined) continue;
          if (ga === null || gb === null) continue; // 片方プールはスキップ
          const violated = c.direction === 'together' ? ga !== gb : ga === gb;
          if (!violated) continue;
          const list = c.strength === 'required' ? required : preferred;
          list.push(c);
        }
        for (const c of required) {
          highlightCard(c.user_id_a, 'violated-required');
          highlightCard(c.user_id_b, 'violated-required');
        }
        for (const c of preferred) {
          highlightCard(c.user_id_a, 'violated-preferred');
          highlightCard(c.user_id_b, 'violated-preferred');
        }
        renderViolationAlerts(required, preferred);
      }
      function highlightCard(userId, cls) {
        document.querySelectorAll(`.grouping-card[data-user-id="${cssEscape(userId)}"]`).forEach((el) => {
          // 必須違反は推奨より強い表示にする
          if (cls === 'violated-required' || !el.classList.contains('violated-required')) el.classList.add(cls);
        });
      }
      function cssEscape(s) { return String(s).replace(/[^\w-]/g, '\\$&'); }
      function nameOfUser(userId) {
        const view = groupingState.view;
        for (const g of (view.groups || [])) { const m = g.members.find((x) => x.user_id === userId); if (m) return m.name; }
        const p = view.pool.find((x) => x.user_id === userId); if (p) return p.name;
        // 制約 API のレスポンスに付いている user_a_name / user_b_name にフォールバック
        // （現参加者でないユーザー（過去参加・退会など）を制約に含めている場合の救済）
        for (const c of (groupingState.constraints || [])) {
          if (c.user_id_a === userId && c.user_a_name) return c.user_a_name;
          if (c.user_id_b === userId && c.user_b_name) return c.user_b_name;
        }
        return userId;
      }
      function renderViolationAlerts(required, preferred) {
        // ツールバーの違反バッジ（スクロール外の違反リストへの気づき用）
        const badge = $('#groupingViolBadge');
        if (badge) {
          if (required.length || preferred.length) {
            const parts = [];
            if (required.length) parts.push(`必須 ${required.length}`);
            if (preferred.length) parts.push(`推奨 ${preferred.length}`);
            badge.textContent = '⚠️ ' + parts.join(' · ');
            badge.style.color = required.length ? 'var(--danger)' : 'var(--warn)';
            badge.classList.remove('hidden');
            badge.onclick = () => { const a = $('#groupingAlerts'); if (a) a.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
          } else {
            badge.classList.add('hidden');
          }
        }
        const el = $('#groupingAlerts');
        if (!required.length && !preferred.length) { el.innerHTML = ''; return; }
        const reqItems = required.map((c) => `<li class="err">必須: ${esc(nameOfUser(c.user_id_a))} と ${esc(nameOfUser(c.user_id_b))} は${c.direction === 'together' ? '同じ' : '別の'}グループにしてください</li>`).join('');
        const prefItems = preferred.map((c) => `<li class="warn">推奨: ${esc(nameOfUser(c.user_id_a))} と ${esc(nameOfUser(c.user_id_b))} は${c.direction === 'together' ? 'なるべく同じ' : 'なるべく別の'}グループに</li>`).join('');
        el.innerHTML = `<div class="grouping-alerts ${required.length ? 'has-error' : ''}">
          <h4>制約違反 (必須 ${required.length} / 推奨 ${preferred.length})</h4>
          <ul>${reqItems}${prefItems}</ul>
        </div>`;
      }
      async function saveGroupingMembers(silent) {
        // 未初期化(view.grouping 無し)なら、グループ枠だけ作って終了。
        // この時点では DOM にグループ列が無い＝D&D 不能なので、メンバー一括保存は走らせない。
        // （旧実装は reload で DOM を全消ししてから空 assignments を送り、保存済み配置を消していた）
        if (!groupingState.view || !groupingState.view.grouping) {
          const gc = Number($('#groupingCount').value);
          if (!Number.isInteger(gc) || gc < 1) { toast('グループ数を指定してください', true); return; }
          await api('/occurrences/' + groupingState.occUuid + '/grouping',
            { method: 'PUT', body: JSON.stringify({ group_count: gc }) });
          await reloadGroupingView();
          if (!silent) toast('グループ枠を作成しました');
          return;
        }
        const { assignments, groupOf } = collectCurrentAssignments();
        const requiredViolations = groupingState.constraints.filter((c) => {
          const ga = groupOf.get(c.user_id_a), gb = groupOf.get(c.user_id_b);
          if (ga == null || gb == null) return false;
          if (c.strength !== 'required') return false;
          return c.direction === 'together' ? ga !== gb : ga === gb;
        });
        if (requiredViolations.length > 0) {
          const ok = await confirmDialog(`必須制約に ${requiredViolations.length} 件の違反があります。このまま保存しますか？`, { okLabel: '保存する', danger: true });
          if (!ok) return;
        }
        try {
          await api('/occurrences/' + groupingState.occUuid + '/grouping/members',
            { method: 'PUT', body: JSON.stringify({ assignments }) });
          groupingState.dirty = false;
          if (!silent) toast('保存しました');
          await reloadGroupingView();
        } catch (e) { toast(e.message, true); }
      }
      async function announceGrouping() {
        if (groupingState.dirty) {
          if (!(await confirmDialog('未保存の変更があります。保存してから投稿しますか？', { okLabel: '保存して投稿' }))) return;
          await saveGroupingMembers(true);
        }
        // 不参加に変更されたメンバーが配置に残っていれば、投稿確認に警告を統合する
        const gone = (groupingState.view && groupingState.view.diff
          ? groupingState.view.diff.no_longer_participating : []) || [];
        // 投稿先はマスター設定（メンバー配置設定・未設定なら募集チャンネル）に固定。確認文に表示する。
        let n = cacheNotifs.find((x) => x.uuid === groupingState.notifUuid);
        if (!n) { try { n = await api('/notifications/' + groupingState.notifUuid); } catch (_) {} }
        if (!cacheChannels.length) { try { cacheChannels = await api('/guilds/' + guild.id + '/channels'); } catch (_) {} }
        const dest = n ? chNameOf(n.grouping_channel_id || n.channel_id) : '通知の設定チャンネル';
        const msg = (gone.length
          ? `⚠️ 不参加に変更されたメンバーが配置に残っています（${gone.map((x) => x.name).join('、')}）。このまま`
          : '') + `現在のメンバー配置を ${dest} へ投稿します。（投稿先は「メンバー配置設定」で変更できます）`;
        if (!(await confirmDialog(msg, { okLabel: '投稿する', danger: gone.length > 0 }))) return;
        try {
          const r = await api('/occurrences/' + groupingState.occUuid + '/grouping/announce', { method: 'POST' });
          toast(r && r.ok ? '投稿しました' : '投稿に失敗しました', !(r && r.ok));
        } catch (e) { toast(e.message, true); }
      }

      // ================= メンバー区分 =================
      async function loadSegments() {
        let segs = [];
        try { segs = await api('/segments?guild_id=' + encodeURIComponent(guild.id)); } catch (e) { toast(e.message, true); }
        cacheSegments = segs;
        const rows = segs.map((s) => `<div class="listrow">
          <div><div style="font-weight:600">${esc(s.name)}</div>
            <div class="muted" style="font-size:12px;margin-top:2px">${s.mention_role_id
              ? `<span class="pill on">ロール管理</span> <span class="pill">${esc(s.mention_role_id)}</span>`
              : '<span class="pill off">手動管理</span>'}</div></div>
          <div class="actions">
            <button class="btn sm secondary" data-smembers="${esc(s.uuid)}">メンバー</button>
            <button class="btn sm ghost" data-sedit="${esc(s.uuid)}">編集</button>
            <button class="btn sm danger" data-sdel="${esc(s.uuid)}">削除</button>
          </div></div>`).join('');
        $('#sec-segments').innerHTML = `<div class="sec-head"><h2>メンバー区分 (${segs.length})</h2>
            <button class="btn" id="segNewBtn">＋ 新規区分</button></div>
          ${segs.length ? rows : '<div class="empty">メンバー区分がまだありません。<br>例: キャスト / スタッフ などを作成しましょう。</div>'}
          <dialog class="modal-lg" id="segDialog" aria-labelledby="segFormTitle">
            <div class="modal-head"><h3 id="segFormTitle">新規区分</h3>
              <button type="button" class="modal-close" id="segClose" aria-label="閉じる">✕</button></div>
            <div class="modal-body">
              <input type="hidden" id="segId" />
              <div class="row">
                <div><label>名前</label><input id="segName" placeholder="例: キャスト" /></div>
                <div><label>ロール / @everyone（任意）<span class="muted">設定するとメンバーをこのロールから自動同期＋メンション先に</span></label><select id="segRole"><option value="">（手動管理）</option></select></div>
              </div>
            </div>
            <div class="modal-foot">
              <button class="btn ghost" type="button" id="segCancel">キャンセル</button>
              <button class="btn" id="segSave">保存</button>
            </div>
          </dialog>`;
        $('#segSave').onclick = (e) => withBusy(e.currentTarget, saveSegment);
        $('#segNewBtn') && ($('#segNewBtn').onclick = () => { resetSegForm(); fillSegRoleOptions(''); $('#segDialog').showModal(); $('#segName').focus(); });
        $('#segClose').onclick = () => $('#segDialog').close();
        $('#segCancel').onclick = () => $('#segDialog').close();
        document.querySelectorAll('#segMembersDialog [data-segm-close]').forEach((b) => { b.onclick = (e) => { e.preventDefault(); closeSegMembersPage(); }; });
        document.querySelectorAll('[data-sedit]').forEach((b) => { b.onclick = () => { const s = segs.find((x) => x.uuid === b.dataset.sedit); fillSegForm(s); fillSegRoleOptions((s && s.mention_role_id) || ''); $('#segDialog').showModal(); }; });
        document.querySelectorAll('[data-smembers]').forEach((b) => { b.onclick = () => navigate('segments/' + b.dataset.smembers + '/members'); });
        document.querySelectorAll('[data-sdel]').forEach((b) => {
          b.onclick = async () => {
            if (!(await confirmDialog('この区分を削除します。', { danger: true, okLabel: '削除' }))) return;
            try { await api('/segments/' + b.dataset.sdel, { method: 'DELETE' }); toast('削除しました'); loadSegments(); }
            catch (e) { toast(e.message, true); }
          };
        });
      }
      // ロールピッカー（区分フォーム）。ロール一覧はサーバー単位でキャッシュし、ダイアログを開くたびに選択肢を再構築する。
      let cacheGuildRoles = null;
      async function fillSegRoleOptions(selected) {
        const sel = $('#segRole');
        if (!sel) return;
        if (!cacheGuildRoles) {
          try { cacheGuildRoles = await api('/guilds/' + guild.id + '/roles'); }
          catch (e) { cacheGuildRoles = []; toast('ロール一覧の取得に失敗しました: ' + e.message, true); }
        }
        const val = selected || '';
        const opts = ['<option value="">（手動管理）</option>', '<option value="@everyone">@everyone（サーバー全員）</option>']
          .concat(cacheGuildRoles.map((r) => `<option value="${esc(r.id)}">${esc(r.name)}</option>`));
        // 保存済みの値が一覧に無い場合（Discord 側でロール削除・過去の誤値）は可視化して選択肢に残す。
        if (val && val !== '@everyone' && !cacheGuildRoles.some((r) => r.id === val)) {
          opts.push(`<option value="${esc(val)}">⚠ 不明なロール (${esc(val)})</option>`);
        }
        sel.innerHTML = opts.join('');
        sel.value = val;
      }
      function resetSegForm() {
        $('#segId').value = ''; $('#segName').value = ''; $('#segRole').value = '';
        $('#segFormTitle').textContent = '新規区分';
      }
      function fillSegForm(s) {
        if (!s) return;
        $('#segId').value = s.uuid; $('#segName').value = s.name;
        $('#segFormTitle').textContent = '編集';
      }
      async function saveSegment() {
        const name = $('#segName').value.trim();
        if (!name) return toast('名前は必須です', true);
        const mention_role_id = $('#segRole').value || null;
        const uuid = $('#segId').value;
        try {
          if (uuid) { await api('/segments/' + uuid, { method: 'PUT', body: JSON.stringify({ name, mention_role_id }) }); toast('更新しました'); }
          else { await api('/segments', { method: 'POST', body: JSON.stringify({ guild_id: guild.id, name, mention_role_id }) }); toast('作成しました'); }
          try { $('#segDialog').close(); } catch (_) {}
          loadSegments();
        } catch (e) { toast(e.message, true); }
      }

      // ----- 区分メンバー（手動ピッカー / ロール同期・ADR 0009） -----
      let cacheGuildMembers = null;
      async function loadSegmentMembers(segUuid) {
        const seg = cacheSegments.find((s) => s.uuid === segUuid);
        const roleManaged = !!(seg && seg.mention_role_id);
        const isEveryone = !!(seg && seg.mention_role_id === '@everyone');
        let list = [];
        try { list = await api('/segments/' + segUuid + '/members'); } catch (e) { return toast(e.message, true); }
        const rows = list.map((m) => {
          const paused = m.status === '休止中';
          const name = m.display_name || m.user_name || m.user_id;
          const delBtn = roleManaged ? '' : `<button class="btn sm danger" data-smdel="${esc(m.user_id)}">外す</button>`;
          return `<div class="pickrow">
            <div>${esc(name)} <span class="muted" style="font-size:12px">${esc(m.user_id)}</span>
              ${paused ? '<span class="pill off">休止中</span>' : '<span class="pill on">アクティブ</span>'}</div>
            <div class="actions">
              <button class="btn sm secondary" data-smtoggle="${esc(m.user_id)}" data-status="${paused ? '' : '休止中'}">${paused ? '再開' : '休止'}</button>
              ${delBtn}
            </div></div>`;
        }).join('');
        const synced = seg && seg.members_synced_at ? esc(seg.members_synced_at) : '未同期';
        const roleLabel = isEveryone ? '@everyone（全員）' : esc(seg ? seg.mention_role_id : '');
        const emptyMsg = roleManaged
          ? 'まだ同期されていません。下の「ロールから同期」を実行してください。'
          : 'まだ誰も所属していません。下のピッカーから追加できます。';
        const panel = roleManaged
          ? `<div class="summary">🔗 <b>ロール管理区分</b>：メンバーは Discord ロール <code>${roleLabel}</code> から自動同期されます（手動の追加/外すは不可・休止は可）。最終同期: ${synced}</div>
             ${isEveryone ? '<p class="muted" style="font-size:12px;color:var(--warn)">⚠️ @everyone はサーバー全員が対象です。リマインド/ノルマの DM も全員へ届きます。</p>' : ''}
             <div class="actions"><button class="btn" id="segSyncBtn">🔄 ロールから同期</button></div>`
          : `<h3 style="margin-top:14px">メンバーを追加</h3>
             <div class="search"><input id="memSearch" placeholder="サーバー参加者を検索（User ID 入力は不要）" /></div>
             <div id="memPicker" style="margin-top:8px"><p class="muted">読み込み中…</p></div>`;
        $('#segMembersTitle').textContent = `区分メンバー: ${seg ? seg.name : segUuid} (${list.length})`;
        $('#segMembersBox').innerHTML = `${list.length ? rows : '<div class="empty">' + emptyMsg + '</div>'}
          ${panel}`;
        openAsPage($('#segMembersDialog'));
        document.querySelectorAll('[data-smtoggle]').forEach((b) => {
          b.onclick = async () => {
            try { await api('/segments/' + segUuid + '/members/' + encodeURIComponent(b.dataset.smtoggle),
              { method: 'PUT', body: JSON.stringify({ status: b.dataset.status }) });
              toast('更新しました'); loadSegmentMembers(segUuid); } catch (e) { toast(e.message, true); }
          };
        });
        document.querySelectorAll('[data-smdel]').forEach((b) => {
          b.onclick = async () => {
            if (!(await confirmDialog('このメンバーを区分から外します。', { danger: true, okLabel: '外す' }))) return;
            try { await api('/segments/' + segUuid + '/members/' + encodeURIComponent(b.dataset.smdel), { method: 'DELETE' });
              toast('外しました'); loadSegmentMembers(segUuid); } catch (e) { toast(e.message, true); }
          };
        });

        if (roleManaged) {
          $('#segSyncBtn').onclick = (e) => withBusy(e.currentTarget, async () => {
            const warn = isEveryone
              ? 'Discord ロール @everyone（サーバー全員）からメンバーを同期します。ロール非保有者は区分から外れ、全員がリマインド/ノルマ DM の対象になります。'
              : 'Discord ロールからメンバーを同期します。ロール非保有の現メンバーは区分から外れます。';
            if (!(await confirmDialog(warn, { okLabel: '同期する', danger: true }))) return;
            try {
              const r = await api('/segments/' + segUuid + '/sync-from-role', { method: 'POST' });
              toast(r && r.message ? r.message : '同期しました');
              try { cacheSegments = await api('/segments?guild_id=' + encodeURIComponent(guild.id)); } catch (_) {}
              loadSegmentMembers(segUuid);
            } catch (e) { toast(e.message, true); }
          });
          return;
        }

        const already = new Set(list.map((m) => m.user_id));
        if (!cacheGuildMembers) {
          try { cacheGuildMembers = await api('/guilds/' + guild.id + '/members'); }
          catch (e) { $('#memPicker').innerHTML = `<p class="muted">サーバー参加者を取得できませんでした（${esc(e.message)}）。Server Members Intent の有効化が必要な場合があります。</p>`; return; }
        }
        const render = (q) => {
          const ql = (q || '').toLowerCase();
          const cand = cacheGuildMembers
            .filter((m) => !already.has(m.user_id))
            .filter((m) => !ql || (m.display_name || '').toLowerCase().includes(ql) || (m.user_name || '').toLowerCase().includes(ql))
            .slice(0, 30);
          $('#memPicker').innerHTML = cand.length ? cand.map((m) => `<div class="pickrow">
            <div>${esc(m.display_name || m.user_name || m.user_id)}
              <span class="muted" style="font-size:12px">${esc(m.user_name || '')}</span></div>
            <button class="btn sm" data-add="${esc(m.user_id)}">追加</button></div>`).join('')
            : '<p class="muted">該当する参加者がいません。</p>';
          document.querySelectorAll('[data-add]').forEach((b) => {
            b.onclick = async () => {
              const m = cacheGuildMembers.find((x) => x.user_id === b.dataset.add);
              try {
                await api('/segments/' + segUuid + '/members', { method: 'POST',
                  body: JSON.stringify({ user_id: m.user_id, user_name: m.user_name, display_name: m.display_name }) });
                toast('追加しました'); loadSegmentMembers(segUuid);
              } catch (e) { toast(e.message, true); }
            };
          });
        };
        render('');
        $('#memSearch').oninput = (e) => render(e.target.value);
      }

      // ================= 回答履歴 =================
      async function loadRecords() {
        let responses = [];
        try {
          responses = await api('/responses?limit=200&guild_id=' + encodeURIComponent(guild.id));

        window.EventBotTable.mount($('#recordsTable'), {
          search: false,
          columns: [
            { id: 'when', header: '開催日時', accessor: (r) => `${r.occurrence_date || ''}${r.occurrence_time ? ' ' + r.occurrence_time : ''}` },
            { id: 'notif', header: '通知', accessor: (r) => r.notification_name || '' },
            { id: 'member', header: 'メンバー', accessor: (r) => r.user_name || r.user_id },
            { id: 'status', header: '回答', accessor: (r) => r.status || '' },
            { id: 'deadline', header: '締切後変更', accessor: (r) => (r.post_deadline_change ? 'あり' : 'なし'),
              render: (v) => v === 'あり' ? '<span class="pill" style="color:var(--warn);border-color:var(--warn)">締切後変更</span>' : '<span class="muted">—</span>' },
            { id: 'updated', header: '更新', accessor: (r) => (r.updated_at || '').slice(0, 19), render: (v) => `<span class="muted">${esc(v)}</span>` },
          ],
          rows: responses,
        });
      }

      async function loadSendLog() {
        let logs = [];
        try {
          logs = await api('/send-log?limit=300&guild_id=' + encodeURIComponent(guild.id));
        } catch (e) { toast(e.message, true); }
        const kindLabel = { recruit: '募集', remind_unanswered: '未回答リマインド', remind_undecided: '未定リマインド', quota: 'ノルマ', deadline_notice: '締切告知' };
        $('#sec-sendlog').innerHTML = `<h2>リマインド送信履歴</h2>
          <p class="muted">cron が送った募集・リマインド・ノルマ・締切告知の記録（直近 ${logs.length} 件・このサーバー: ${esc(guild.name || guild.id)}）。DM 拒否などの失敗もここで確認できます。</p>
          <div id="sendlogTable"></div>`;
        if (!logs.length) {
          $('#sendlogTable').innerHTML = '<div class="empty">まだ送信記録がありません。送信時刻になると cron が送信し、ここに記録されます。</div>';
          return;
        }
        window.EventBotTable.mount($('#sendlogTable'), {
          search: false,
          columns: [
            { id: 'date', header: '送信日', accessor: (r) => r.send_date || '' },
            { id: 'notif', header: '通知', accessor: (r) => r.notification_name || '' },
            { id: 'occ', header: '開催日', accessor: (r) => r.occurrence_date || '' },
            { id: 'kind', header: '種別', accessor: (r) => kindLabel[r.kind] || r.kind },
            { id: 'to', header: '宛先', accessor: (r) => r.user_name || r.user_id || '（チャンネル）',
              render: (v, r) => !r.user_id ? '<span class="muted">（チャンネル）</span>'
                : r.user_name ? `${esc(r.user_name)} <span class="muted" style="font-size:11px">${esc(r.user_id)}</span>`
                : esc(r.user_id) },
            { id: 'status', header: '結果', accessor: (r) => r.status,
              render: (v) => v === 'sent' ? '<span class="pill on">送信</span>' : v === 'failed' ? '<span class="pill" style="color:var(--danger);border-color:var(--danger)">失敗</span>' : `<span class="pill">${esc(v)}</span>` },
            { id: 'error', header: '詳細', accessor: (r) => r.error || '', render: (v) => v ? `<span class="muted">${esc(v)}</span>` : '' },
          ],
          rows: logs,
        });
      }

      // ================= セットアップ ウィザード =================
      async function loadSetup() {
        let st = null;
        try { st = await api('/setup/status'); } catch (e) { return toast(e.message, true); }
        const secretRow = (key, label) => {
          const ok = st.secrets[key];
          return `<div class="pickrow"><div>${ok ? '✅' : '⚠️'} <b>${esc(key)}</b><br>
            <span class="muted" style="font-size:12px">${esc(label)}</span></div>
            <span class="pill ${ok ? 'on' : 'off'}">${ok ? '設定済み' : '未設定'}</span></div>`;
        };
        const endpoint = st.interaction_endpoint_url;
        $('#sec-setup').innerHTML = `
          <h2>⚙️ セットアップ</h2>
          <p class="muted">初期設定をここで完了できます。上から順に進めてください。</p>

          <fieldset><legend>1. シークレットの確認</legend>
            <p class="muted" style="font-size:13px">Cloudflare の管理画面（Settings → Variables and Secrets）で設定します。未設定があると Bot は動きません。</p>
            ${secretRow('DISCORD_PUBLIC_KEY', '署名検証用の公開鍵（Discord → General Information）')}
            ${secretRow('DISCORD_APPLICATION_ID', 'アプリID（Discord → General Information）')}
            ${secretRow('DISCORD_BOT_TOKEN', 'Bot のトークン（Discord → Bot）')}
            ${secretRow('ADMIN_TOKEN', 'この管理画面のパスワード（自分で決めた文字列）')}
            <div class="actions" style="margin-top:8px"><button class="btn sm secondary" id="setupReload">再読み込み</button></div>
          </fieldset>

          <fieldset><legend>2. スラッシュコマンドを登録</legend>
            <p class="muted" style="font-size:13px">/notify /help /manage の 3 つを Discord に登録します（このサーバーへ即時反映）。</p>
            <div class="actions"><button class="btn" id="setupRegister">コマンドを登録</button></div>
            <div id="setupRegisterResult" class="muted" style="font-size:13px;margin-top:8px"></div>
          </fieldset>

          <fieldset><legend>3. Interaction Endpoint URL を Discord に設定</legend>
            <p class="muted" style="font-size:13px">下の URL をコピーし、Discord Developer Portal → General Information の
              「Interactions Endpoint URL」に貼り付けて保存してください。</p>
            <div class="pickrow"><code style="word-break:break-all">${esc(endpoint)}</code>
              <button class="btn sm" id="setupCopy">コピー</button></div>
            <p class="muted" style="font-size:13px;margin-top:8px">続けて Discord → Bot の
              <b>Server Members Intent</b> を ON にしてください（メンバー一覧の取得に必要）。</p>
          </fieldset>

          <fieldset><legend>4. 中身を設定する</legend>
            <p class="muted" style="font-size:13px">左メニューの「メンバー区分」→「通知」の順に作成し、メンバーを登録すれば完了です。</p>
          </fieldset>`;
        $('#setupReload').onclick = loadSetup;
        $('#setupCopy').onclick = async () => {
          try { await navigator.clipboard.writeText(endpoint); toast('コピーしました'); }
          catch (_) { toast('コピーできませんでした。URL を手動で選択してください', true); }
        };
        $('#setupRegister').onclick = (ev) => withBusy(ev.currentTarget, async () => {
          const res = $('#setupRegisterResult');
          res.textContent = '登録中…';
          try {
            const r = await api('/setup/register-commands', { method: 'POST', body: JSON.stringify({ guild_id: guild.id }) });
            if (r && r.ok) { res.textContent = `✅ 登録しました: ${(r.names || []).map((n) => '/' + n).join(' ')}`; toast('コマンドを登録しました'); }
            else { res.textContent = '⚠️ ' + ((r && r.error) || '登録に失敗しました'); }
          } catch (e) { res.textContent = '⚠️ ' + e.message; toast(e.message, true); }
        });
      }

      // ================= 認証・起動 =================
      $('#tokenSave').onclick = () => {
        token = $('#tokenInput').value.trim();
        localStorage.setItem(TOKEN_KEY, token);
        boot();
      };
      $('#logout').onclick = $('#pickerLogout').onclick = () => {
        localStorage.removeItem(TOKEN_KEY); token = ''; cacheGuilds = null; showGate();
      };

      function boot() {
        if (!token) return showGate();
        const saved = localStorage.getItem(GUILD_KEY);
        // 新形式 `g/<gid>/...`、旧形式 `<gid>`、空のいずれも許容（旧→新は自動補正）
        const { guildId } = parseHash();
        if (saved) {
          try {
            const g = JSON.parse(saved);
            if (!guildId || guildId === g.id) {
              guild = g;
              showWorkspace();
              // 初期ハッシュが `g/<gid>/...` 形式ならルータでモーダル復帰、なければ何もしない
              handleHashRoute();
              return;
            }
          } catch (_) {}
        }
        showPicker();
      }
      boot();
    </script>
  </body>
</html>
